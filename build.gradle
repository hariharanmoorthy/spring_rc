plugins {
    id 'java'
    id 'war'
}

group = 'com.hari'

compileJava {
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-webmvc:7.0.8'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'com.zaxxer:HikariCP:6.3.0'
    implementation 'org.flywaydb:flyway-core:11.10.3'
    implementation 'org.flywaydb:flyway-database-postgresql:11.10.3'
    implementation 'org.springframework.kafka:spring-kafka:3.3.9'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    testImplementation 'org.springframework.kafka:spring-kafka-test:3.3.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}