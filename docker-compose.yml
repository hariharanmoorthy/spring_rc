services:
  postgres:
    image: postgres:15
    container_name: spring_rc_postgres
    environment:
      POSTGRES_DB: springlearn
      POSTGRES_USER: hari
      POSTGRES_PASSWORD: hari
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hari -d springlearn"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: springlearn
      DB_USER: hari
      DB_PASSWORD: hari
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

#  nginx:
#    image: nginx:latest
#    container_name: spring_rc_nginx
#    ports:
#      - "8080:8080"
#    volumes:
#      - ./nginx.conf:/etc/nginx/nginx.conf:ro
#    depends_on:
#      - app
#    networks:
#      - app_network

  loadbalancer:
    build:
      context: ./loadbalancer
      dockerfile: Dockerfile
    container_name: spring_rc_lb
    ports:
      - "8080:8080"
    environment:
      BACKEND_HOST: app
      BACKEND_PORT: 8080
    depends_on:
      - app
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
