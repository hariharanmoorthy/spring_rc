server.port=8080
backend.host=app
backend.port=8080

# --- API Gateway settings ---
gateway.connect-timeout-ms=2000
gateway.read-timeout-ms=5000

# --- Rate limiter (token bucket, per client) ---
# Max burst requests a single client can make instantaneously
ratelimit.capacity=20
# Sustained requests/sec allowed per client after burst is consumed
ratelimit.refill-per-second=0.2
# Idle client buckets older than this are evicted to bound memory usage
ratelimit.idle-eviction-minutes=30
# How often the eviction sweep runs
ratelimit.eviction-check-interval-ms=300000

# --- Redis (backing store for rate-limit token buckets) ---
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

